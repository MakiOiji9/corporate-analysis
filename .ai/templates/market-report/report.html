<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="tools/report/market_report.py build">
<title>${title}</title>
<style>
:root {
  --paper: #f5f2ea;
  --surface: #fffdf7;
  --surface-2: #efebe0;
  --ink: #1a1c21;
  --ink-2: #474c56;
  --ink-3: #6f747d;
  --rule: #d6cfbf;
  --rule-soft: #e6e0d2;
  --jp: #c23a22;
  --jp-2: #e3936f;
  --us: #1d4a85;
  --us-2: #5f8fca;
  --ochre: #a77a12;
  --pos: #1f7a52;
  --neg: #b3261e;
  --bull: #1f7a52;
  --neutral: #5a6472;
  --cautious: #a86400;
  --bear: #b3261e;
  --on-badge: #ffffff;
  --shadow: 0 1px 0 rgba(26, 28, 33, .04), 0 10px 30px -18px rgba(26, 28, 33, .35);
  --font-sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  --font-serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Times New Roman", serif;
  --step--1: clamp(.78rem, .75rem + .15vw, .86rem);
  --step-0: clamp(.92rem, .88rem + .2vw, 1.02rem);
  --step-1: clamp(1.1rem, 1rem + .45vw, 1.3rem);
  --step-2: clamp(1.45rem, 1.2rem + 1.1vw, 2.1rem);
  --step-3: clamp(2rem, 1.4rem + 2.6vw, 3.6rem);
  --gutter: clamp(16px, 4vw, 56px);
  --radius: 10px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111317; --surface: #191c22; --surface-2: #22262e; --ink: #ece7dc; --ink-2: #bdb7ab; --ink-3: #8f939c;
    --rule: #333843; --rule-soft: #272b33; --jp: #ec6a4f; --jp-2: #f2a585; --us: #79a6e6; --us-2: #a9c6ee;
    --ochre: #dcae45; --pos: #4cc08a; --neg: #f0645a; --bull: #4cc08a; --neutral: #9aa3b0; --cautious: #f0a63a;
    --bear: #f0645a; --on-badge: #111317; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111317; --surface: #191c22; --surface-2: #22262e; --ink: #ece7dc; --ink-2: #bdb7ab; --ink-3: #8f939c;
  --rule: #333843; --rule-soft: #272b33; --jp: #ec6a4f; --jp-2: #f2a585; --us: #79a6e6; --us-2: #a9c6ee;
  --ochre: #dcae45; --pos: #4cc08a; --neg: #f0645a; --bull: #4cc08a; --neutral: #9aa3b0; --cautious: #f0a63a;
  --bear: #f0645a; --on-badge: #111317; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 30px -18px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-snap-type: y proximity; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-sans); font-size: var(--step-0);
  line-height: 1.7; font-feature-settings: "palt" 1; overflow-x: hidden; }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 600; line-height: 1.25; margin: 0; letter-spacing: .01em; }
p { margin: 0 0 .6em; }
strong { font-weight: 700; }

/* ---------- chrome ---------- */
.progress { position: fixed; inset: 0 0 auto 0; height: 3px; z-index: 20; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--jp), var(--us));
  transform-origin: left; transform: scaleX(0); transition: transform .4s var(--ease); }
.dots { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 20; display: flex;
  flex-direction: column; gap: 9px; }
.dots a { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); display: block; position: relative;
  transition: transform .2s var(--ease), background .2s; }
.dots a:hover, .dots a:focus-visible { transform: scale(1.6); background: var(--ink-3); outline: none; }
.dots a.on { background: var(--ink); transform: scale(1.35); }
.dots a span { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); white-space: nowrap;
  font-size: 12px; background: var(--ink); color: var(--paper); padding: 2px 8px; border-radius: 4px; opacity: 0;
  pointer-events: none; transition: opacity .15s; }
.dots a:hover span, .dots a:focus-visible span { opacity: 1; }
.pager { position: fixed; right: 18px; bottom: 16px; z-index: 20; display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 6px; box-shadow: var(--shadow); }
.pager button { border: 0; background: transparent; color: var(--ink); width: 32px; height: 32px; border-radius: 50%;
  font-size: 15px; cursor: pointer; transition: background .15s, transform .1s; }
.pager button:hover { background: var(--surface-2); }
.pager button:focus-visible { outline: 2px solid var(--us); outline-offset: 1px; }
.pager button:active { transform: scale(.92); }
.counter { font-size: 12px; color: var(--ink-3); min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; }
.counter b { color: var(--ink); font-weight: 700; }

/* ---------- slides ---------- */
.slide { min-height: 100vh; min-height: 100svh; scroll-snap-align: start; padding: clamp(48px, 7vh, 88px) var(--gutter);
  display: flex; align-items: center; border-bottom: 1px solid var(--rule-soft); }
.slide.alt { background: var(--surface); }
.inner { width: 100%; max-width: 1240px; margin: 0 auto; }
.kicker { display: flex; align-items: baseline; gap: 14px; font-size: var(--step--1); color: var(--ink-3);
  letter-spacing: .14em; margin-bottom: 10px; }
.kicker .no { font-family: var(--font-serif); font-size: 1.5em; color: var(--ink); letter-spacing: 0; }
.kicker::after { content: ""; flex: 1; height: 1px; background: var(--rule); transform: translateY(-4px); }
.slide h2 { font-size: var(--step-2); margin-bottom: clamp(18px, 3vh, 32px); }
.grid { display: grid; gap: clamp(16px, 2.2vw, 28px); }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.wide-left { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.stack { display: grid; gap: 16px; align-content: start; }
.muted { color: var(--ink-3); }
.small { font-size: var(--step--1); }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px; }
.alt .panel, .alt figure.chartbox, .alt .view, .alt .risk, .alt .kpi { background: var(--paper); }
.panel h3 { font-size: var(--step-1); margin-bottom: 8px; }
.tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: .06em;
  padding: 0 9px; border-radius: 999px; border: 1px solid currentColor; line-height: 1.6; white-space: nowrap; }
.tag.japan { color: var(--jp); }
.tag.us { color: var(--us); }
.tag.both { color: var(--ochre); }

/* judgement badges: colour carries the meaning, the word is always printed too */
.badge { display: inline-block; font-family: var(--font-serif); font-weight: 700; color: var(--on-badge); border-radius: 6px;
  padding: .05em .55em; letter-spacing: .08em; }
.badge.j-bull { background: var(--bull); }
.badge.j-neutral { background: var(--neutral); }
.badge.j-cautious { background: var(--cautious); }
.badge.j-bear { background: var(--bear); }
.badge.j-none { background: var(--rule); color: var(--ink-2); }

/* cover */
.cover { background:
  radial-gradient(1100px 480px at 88% -12%, color-mix(in srgb, var(--us) 12%, transparent), transparent),
  radial-gradient(900px 480px at -12% 112%, color-mix(in srgb, var(--jp) 12%, transparent), transparent), var(--paper); }
.cover .brand { font-size: var(--step--1); letter-spacing: .3em; color: var(--ink-3); margin-bottom: 10px; }
.cover h1 { font-size: var(--step-3); letter-spacing: .02em; }
.cover .period { font-size: var(--step-1); color: var(--ink-2); margin: 6px 0 28px; }
.verdicts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-bottom: 8px; }
.verdict { border-top: 4px solid var(--rule); padding-top: 14px; }
.verdict.japan { border-color: var(--jp); }
.verdict.us { border-color: var(--us); }
.verdict .market { font-weight: 700; letter-spacing: .12em; font-size: var(--step--1); color: var(--ink-2); }
.verdict .badge { font-size: var(--step-2); margin: 8px 0; }
.verdict .delta { font-size: var(--step--1); color: var(--ink-3); margin-bottom: 6px; }
.toc { list-style: none; padding: 0; margin: 0; font-size: var(--step--1); }
.toc li { border-top: 1px solid var(--rule-soft); }
.toc a { display: flex; gap: 10px; padding: 6px 2px; text-decoration: none; color: var(--ink-2); transition: color .15s, padding .2s var(--ease); }
.toc a:hover, .toc a:focus-visible { color: var(--ink); padding-left: 8px; outline: none; }
.toc a span:first-child { font-family: var(--font-serif); color: var(--ink-3); width: 1.8em; }
.meta { margin-top: 26px; font-size: var(--step--1); color: var(--ink-3); }

/* key messages */
.messages { list-style: none; counter-reset: msg; margin: 0; padding: 0; }
.messages li { counter-increment: msg; display: grid; grid-template-columns: 3.4rem 1fr; gap: 16px; align-items: start;
  padding: 16px 0; border-top: 1px solid var(--rule); font-size: var(--step-1); line-height: 1.6; }
.messages li:last-child { border-bottom: 1px solid var(--rule); }
.messages li::before { content: counter(msg, decimal-leading-zero); font-family: var(--font-serif); font-size: var(--step-2);
  line-height: 1; color: var(--jp); }
.messages li:nth-child(even)::before { color: var(--us); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 22px; }
.kpi { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px 10px 16px;
  position: relative; overflow: hidden; transition: transform .25s var(--ease), box-shadow .25s; }
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--rule); }
.kpi.japan::before { background: var(--jp); }
.kpi.us::before { background: var(--us); }
.kpi .label { font-size: var(--step--1); color: var(--ink-2); font-weight: 700; }
.kpi .value { font-family: var(--font-serif); font-size: var(--step-2); line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi .unit { font-size: var(--step--1); color: var(--ink-3); margin-left: 4px; font-family: var(--font-sans); }
.kpi .asof { font-size: 11px; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.chips i { font-style: normal; color: var(--ink-3); margin-right: 3px; }
.spark { width: 100%; height: 36px; display: block; margin-top: 6px; }
.spark path { fill: none; stroke: var(--ink-3); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.kpi.japan .spark path { stroke: var(--jp); }
.kpi.us .spark path { stroke: var(--us); }
.spark circle { fill: var(--ink); }

/* charts */
figure { margin: 0; }
figure.chartbox { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px 10px; }
figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; align-items: baseline; margin-bottom: 4px; }
figcaption b { font-size: var(--step-0); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.source { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; font-family: var(--font-sans); }
svg.chart .grid { stroke: var(--rule-soft); stroke-width: 1; }
svg.chart .grid.zero { stroke: var(--ink-3); }
svg.chart .tick { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
svg.chart .ln { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
svg.chart .end { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; stroke: none; }
svg.chart .hit { fill: transparent; }
svg.chart .hit:hover { fill: var(--ink); fill-opacity: .3; }
svg.chart .bar.pos { fill: var(--pos); fill-opacity: .78; }
svg.chart .bar.neg { fill: var(--neg); fill-opacity: .78; }
svg.chart .bar:hover { fill-opacity: 1; }
.pal-cmp { --c0: var(--jp); --c1: var(--us); --c2: var(--us-2); }
.pal-jp { --c0: var(--jp); --c1: var(--jp-2); --c2: var(--ochre); }
.pal-us { --c0: var(--us); --c1: var(--us-2); --c2: var(--ochre); }
svg .ln.s0 { stroke: var(--c0); } svg .ln.s1 { stroke: var(--c1); } svg .ln.s2 { stroke: var(--c2); }
text.s0, circle.s0 { fill: var(--c0); } text.s1, circle.s1 { fill: var(--c1); } text.s2, circle.s2 { fill: var(--c2); }
.sw.s0 { background: var(--c0); } .sw.s1 { background: var(--c1); } .sw.s2 { background: var(--c2); }
.chart-empty { display: grid; place-items: center; min-height: 140px; color: var(--ink-3); font-size: var(--step--1);
  border: 1px dashed var(--rule); border-radius: 8px; }

/* findings (見たもの → 情報源 → 結論) */
.finding { border-left: 3px solid var(--rule); padding: 2px 0 2px 14px; }
.finding.japan { border-color: var(--jp); }
.finding.us { border-color: var(--us); }
.finding .head { margin-bottom: 4px; }
.finding .conclusion { font-weight: 700; margin-bottom: 4px; line-height: 1.6; }
.finding .seen { color: var(--ink-2); font-size: var(--step--1); }
.finding .src { color: var(--ink-3); font-size: 11px; margin-top: 4px; overflow-wrap: anywhere; }

/* tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: var(--step--1); font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 700; color: var(--ink-3); border-bottom: 1px solid var(--rule); padding: 5px 8px; white-space: nowrap; }
td { border-bottom: 1px solid var(--rule-soft); padding: 5px 8px; vertical-align: top; }
td.r, th.r { text-align: right; white-space: nowrap; }
td.nw { white-space: nowrap; }
tr.group td { color: var(--ink-3); font-weight: 700; padding-top: 12px; border-bottom-color: var(--rule); }
/* scorecard: viewpoint ratings (追い風 / 中立 / 逆風) and their weekly history */
td.rt { text-align: center; font-weight: 700; white-space: nowrap; }
td.r-head { background: color-mix(in srgb, var(--bull) 20%, transparent); color: var(--bull); }
td.r-neutral { background: color-mix(in srgb, var(--neutral) 12%, transparent); color: var(--ink-2); }
td.r-tail { background: color-mix(in srgb, var(--bear) 20%, transparent); color: var(--bear); }
table.heat td.rt .badge { font-size: var(--step--1); padding: 1px 6px; }
/* cover: the three axis labels under the attention badge */
.axis-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.axis-chip { font-size: var(--step--1); border-radius: 999px; padding: 2px 10px; background: var(--surface-2); color: var(--ink-2); }
.axis-chip i { font-style: normal; color: var(--ink-3); margin-right: 6px; }
.axis-chip.r-tail { background: color-mix(in srgb, var(--bear) 18%, transparent); color: var(--bear); }
.axis-chip.r-head { background: color-mix(in srgb, var(--bull) 18%, transparent); color: var(--bull); }
/* sectors: a bar per sector, centred on zero (the gap against the index) */
td.hbar-cell { width: 45%; }
.hbar { position: relative; height: 12px; background: var(--surface-2); border-radius: 3px; }
.hbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ink-3); }
.hbar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.hbar i.pos { left: 50%; background: var(--pos); }
.hbar i.neg { right: 50%; background: var(--neg); }
/* glossary on the last slide */
dl.glossary { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: var(--step--1); }
dl.glossary dt { font-weight: 700; white-space: nowrap; }
dl.glossary dd { margin: 0; color: var(--ink-2); }
@media (max-width: 720px) { dl.glossary { grid-template-columns: 1fr; } dl.glossary dt { margin-top: 6px; } }
tbody tr:hover td { background: color-mix(in srgb, var(--ink) 4%, transparent); }

/* timeline */
.weeks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 32px; }
.week h3 { font-family: var(--font-sans); font-size: var(--step--1); color: var(--ink-3); letter-spacing: .08em;
  border-bottom: 1px solid var(--rule); padding-bottom: 4px; margin: 8px 0 2px; }
.event { display: grid; grid-template-columns: 4.4em 10px minmax(0, 1fr); gap: 10px; padding: 6px 0; align-items: start; }
.event .d { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: var(--step--1); }
.event .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: var(--ink-3); }
.event .dot.japan { background: var(--jp); }
.event .dot.us { background: var(--us); }
.event .t { font-weight: 700; line-height: 1.45; }
.event .x { font-size: var(--step--1); color: var(--ink-2); }
.event .pt { font-size: var(--step--1); border-left: 2px solid var(--ochre); padding-left: 8px; margin-top: 3px; }
.event .c { font-size: 11px; color: var(--ink-3); }

/* outlook matrix */
.horizon { display: grid; grid-template-columns: 8.5rem repeat(2, minmax(0, 1fr)); gap: 14px; padding: 14px 0;
  border-top: 1px solid var(--rule); }
.horizon .when h3 { font-size: var(--step-1); }
.horizon .when p { font-size: 12px; color: var(--ink-3); margin: 2px 0 0; }
.view { border-radius: var(--radius); padding: 12px 14px 12px 16px; background: var(--surface); border: 1px solid var(--rule); }
.view.japan { box-shadow: inset 3px 0 0 var(--jp); }
.view.us { box-shadow: inset 3px 0 0 var(--us); }
.view header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.view .scenario { margin-bottom: 8px; line-height: 1.6; }
.view dl { display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 3px 8px; margin: 0; font-size: var(--step--1); }
.view dt { color: var(--ink-3); }
.view dd { margin: 0; }

/* risk map */
.riskmap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.lane h3 { font-family: var(--font-sans); font-size: var(--step--1); letter-spacing: .1em; padding: 5px 10px; border-radius: 6px;
  color: var(--on-badge); margin-bottom: 10px; }
.lane.hi h3 { background: var(--bear); }
.lane.mid h3 { background: var(--cautious); }
.lane.lo h3 { background: var(--neutral); }
.risk { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
.risk .t { font-weight: 700; margin: 4px 0 2px; line-height: 1.45; }
.risk .x { font-size: var(--step--1); color: var(--ink-2); }
.risk .s { font-size: 11px; color: var(--ink-3); margin-top: 4px; overflow-wrap: anywhere; }
.empty-lane { font-size: var(--step--1); color: var(--ink-3); }

ul.plain { margin: 0; padding-left: 1.2em; }
ul.plain li { margin-bottom: 4px; overflow-wrap: anywhere; }
.disclaimer { margin-top: 20px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; font-size: var(--step--1);
  color: var(--ink-2); background: var(--surface-2); }

@media (max-width: 960px) {
  .cols-2, .wide-left, .verdicts, .weeks, .riskmap, .horizon { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dots { display: none; }
  .slide { min-height: auto; padding-top: 56px; padding-bottom: 64px; }
}
@media (max-width: 420px) { .kpis { grid-template-columns: minmax(0, 1fr); } }

@media print {
  @page { size: A4 landscape; margin: 10mm; }
  html { scroll-snap-type: none; }
  body { background: #fff; font-size: 10pt; }
  .progress, .dots, .pager { display: none !important; }
  .slide { min-height: auto; break-after: page; padding: 0; border: 0; display: block; }
  .panel, .kpi, figure.chartbox, .view, .risk { box-shadow: none; break-inside: avoid; }
}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><span></span></div>
<nav class="dots" aria-label="スライド一覧">${dots}</nav>
<main>
${slides}
</main>
<div class="pager" role="navigation" aria-label="スライド移動">
  <button type="button" data-step="-1" aria-label="前のスライド">&#8593;</button>
  <span class="counter"><b>01</b> / ${total}</span>
  <button type="button" data-step="1" aria-label="次のスライド">&#8595;</button>
</div>
<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var dots = Array.prototype.slice.call(document.querySelectorAll(".dots a"));
  var bar = document.querySelector(".progress span");
  var counter = document.querySelector(".counter b");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var current = 0;
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function update() {
    bar.style.transform = "scaleX(" + (current + 1) / slides.length + ")";
    counter.textContent = pad(current + 1);
    dots.forEach(function (d, i) {
      d.classList.toggle("on", i === current);
      if (i === current) { d.setAttribute("aria-current", "true"); } else { d.removeAttribute("aria-current"); }
    });
  }
  function go(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    slides[i].scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { current = slides.indexOf(e.target); update(); }
      });
    }, { rootMargin: "-45% 0px -50% 0px", threshold: 0 });
    slides.forEach(function (s) { io.observe(s); });
  }
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) { return; }
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(current + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(current - 1); }
    else if (e.key === "Home") { e.preventDefault(); go(0); }
    else if (e.key === "End") { e.preventDefault(); go(slides.length - 1); }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".pager button"), function (b) {
    b.addEventListener("click", function () { go(current + Number(b.getAttribute("data-step"))); });
  });
  update();
})();
</script>
</body>
</html>
