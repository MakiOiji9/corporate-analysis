# Read by .github/workflows/issue-company-report.yml through tools/report/issue_request.py.
# The `label` of each field is the heading the script looks for: change both together.
name: 企業の初期分析
description: 指定した企業の情報を収集し、企業分析レポートまで自動で作ってコミットする
title: "[企業分析] "
labels: [company-analysis]
body:
  - type: markdown
    attributes:
      value: |
        起票すると GitHub Actions が情報収集（初回のみ）→ STEP 1〜3 の分析 → 企業分析レポートを作り、main にコミットしてこの Issue にコメントして閉じます。
        - 1社あたり数十分〜数時間かかります。失敗したときはコメントして開いたままにします（Actions の Re-run でやり直せます）
        - 既に `companies/` にある企業は、収集を飛ばしてレポートを作り直します
        - 動くのはリポジトリのオーナー・コラボレーターが起票したとき（またはラベル `company-analysis` を付けたとき）だけです
  - type: input
    id: ticker
    attributes:
      label: 銘柄コード
      description: 日本株は4桁の証券コード、米国株はティッカー
      placeholder: "7203 / AAPL"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 企業名（英語）
      description: 半角小文字・数字・ハイフンだけ。ディレクトリ名 `{銘柄コード}_{企業名}` になる
      placeholder: toyota
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: ホームページ URL
      description: 情報収集の起点になる企業サイト（https://）
      placeholder: "https://global.toyota/jp/"
    validations:
      required: true
  - type: dropdown
    id: market
    attributes:
      label: 市場
      options:
        - japan
        - us
    validations:
      required: true
