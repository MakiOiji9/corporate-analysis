name: Setup reports
description: >-
  Python (.venv via tools/setup.sh), .env from secrets, the git-ignored originals (sources/ and .cache/) from the
  Actions cache, and a pinned Claude Code CLI. The Claude credential is NOT handled here: the workflow passes it
  only to the step that runs Claude.

inputs:
  edinet-api-key:
    description: EDINET API v2 subscription key
    required: false
    default: ""
  fred-api-key:
    description: FRED API key
    required: false
    default: ""
  sec-user-agent:
    description: SEC EDGAR contact User-Agent "<name> <email>"
    required: false
    default: ""
  claude-code-version:
    description: "@anthropic-ai/claude-code version to install"
    required: true

outputs:
  cache-key:
    description: The key to save the originals under at the end of the job (actions/cache/save)
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: tools/requirements.txt

    # .env is git-ignored; the scripts read it themselves (tools/collect/common.py load_env).
    - name: Write .env
      shell: bash
      env:
        EDINET_API_KEY: ${{ inputs.edinet-api-key }}
        FRED_API_KEY: ${{ inputs.fred-api-key }}
        SEC_USER_AGENT: ${{ inputs.sec-user-agent }}
      run: |
        umask 077
        {
          printf 'EDINET_API_KEY=%s\n' "$EDINET_API_KEY"
          printf 'FRED_API_KEY=%s\n' "$FRED_API_KEY"
          printf 'SEC_USER_AGENT=%s\n' "$SEC_USER_AGENT"
        } > .env

    - name: Python environment (.venv)
      shell: bash
      run: sh tools/setup.sh

    # Originals (companies/*/sources, market/**/sources) and tool caches are not in git. Restore the newest
    # copy; the workflow saves a new one at the end of the job (even when the job failed). manifest.csv is in
    # git, so it is never cached (a restore must not roll it back).
    - name: Cache key
      id: key
      shell: bash
      run: echo "key=report-originals-${{ github.run_id }}-${{ github.run_attempt }}-$(date +%s)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          companies/*/sources
          market/**/sources
          .cache
          !companies/*/sources/manifest.csv
          !market/**/sources/manifest.csv
        key: ${{ steps.key.outputs.key }}
        restore-keys: report-originals-

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"
    - name: Install Claude Code
      shell: bash
      run: |
        npm install -g "@anthropic-ai/claude-code@${{ inputs.claude-code-version }}"
        claude --version
