# Initial analysis of a company requested by an Issue (.github/ISSUE_TEMPLATE/company-analysis.yml).
# Each Issue gets a work branch (analysis/issue-{n}) and a draft PR. The collection runs one agent per Claude run
# (tools/collect/collect_progress.py decides what is left), and every run is committed and pushed to the branch,
# with an autosave every few minutes in between, so a run stopped by the usage limit continues where it stopped.
# Then /company-report; when the report is built the PR is marked ready, squash-merged into main (it closes the
# Issue) and the verdicts are commented. On failure the PR stays a draft and the Issue stays open: Re-run failed
# jobs, or adding the label again, continues from the branch.
# Only issues opened by the owner or a collaborator run; the body is never handed to Claude as is
# (tools/report/issue_request.py extracts and validates the four fields).
# Credentials and settings: see "GitHub Actions での定期実行" in tools/README.md.
name: issue-company-report

# "labeled", not "opened": an Issue created from the template gets the label at creation (a labeled event fires
# then too), and an Issue whose label was missing or that should run again can be started by adding the label.
on:
  issues:
    types: [labeled]

# One run per Issue. Not the scheduled runs' "reports" group: a queued Issue would cancel a pending scheduled run.
concurrency:
  group: issue-report-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Asia/Tokyo # every script dates its files with the local date
  CLAUDE_CODE_VERSION: "2.1.123"
  BRANCH: analysis/issue-${{ github.event.issue.number }}

jobs:
  request:
    # The template applies the label for anyone who opens the Issue, so the author must be trusted; a label added
    # by someone else (adding labels needs triage access to the repository) is trusted as well.
    if: >-
      github.event.label.name == 'company-analysis' &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
       github.event.sender.login != github.event.issue.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      ok: ${{ steps.parse.outputs.ok }}
      ticker: ${{ steps.parse.outputs.ticker }}
      name: ${{ steps.parse.outputs.name }}
      url: ${{ steps.parse.outputs.url }}
      market: ${{ steps.parse.outputs.market }}
      dir: ${{ steps.parse.outputs.dir }}
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - id: parse
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/issue-body.md"
          status=0
          python3 -I tools/report/issue_request.py parse --body-file "$RUNNER_TEMP/issue-body.md" \
            > "$RUNNER_TEMP/request.json" || status=$?
          cat "$RUNNER_TEMP/request.json"
          python3 -I - "$RUNNER_TEMP/request.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"ok={'true' if data.get('ok') else 'false'}")
          for key in ("ticker", "name", "url", "market", "dir"):
              print(f"{key}={data.get(key) or ''}")
          PY
          echo "exit status: $status"

      - name: Reject an invalid request
        if: ${{ steps.parse.outputs.ok != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          python3 -I - "$RUNNER_TEMP/request.json" > "$RUNNER_TEMP/comment.md" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print("## 依頼の内容を読み取れなかった\n")
          print("\n".join(f"- {e}" for e in data.get("errors", [])))
          print("\nテンプレート「企業の初期分析」で新しい Issue を起票し直してください（この Issue は閉じます）。")
          PY
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$ISSUE" --reason "not planned"

      # The work branch starts from main with an empty commit (a PR needs a difference); a branch that already
      # exists (a re-run, the label added again) is kept with what it has.
      - name: Work branch and draft PR
        id: pr
        if: ${{ steps.parse.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          DIR: ${{ steps.parse.outputs.dir }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" "$BRANCH" > /dev/null; then
            echo "既存の作業ブランチ $BRANCH を使う"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit --quiet --allow-empty -m "chore: ${DIR} の初期分析を開始（Issue #${ISSUE}）"
            git push --quiet "$remote" "HEAD:refs/heads/${BRANCH}"
          fi
          pr="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')"
          if [ -z "$pr" ]; then
            printf '%s\n' "Closes #${ISSUE}" "" \
              "Issue #${ISSUE} の企業（\`companies/${DIR}\`）の初期分析。GitHub Actions（issue-company-report）が情報収集を担当ごとに進めてこのブランチにコミットし、企業分析レポートまでできたら Ready にして main にスカッシュマージする。" \
              "" "途中で止まったときは Issue のラベル \`company-analysis\` を付け直すと、済んだ部分を飛ばして続きから進む。" \
              > "$RUNNER_TEMP/pr-body.md"
            pr="$(gh pr create --draft --base main --head "$BRANCH" --title "[企業分析] ${DIR}" --body-file "$RUNNER_TEMP/pr-body.md")"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Acknowledge
        if: ${{ steps.parse.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          DIR: ${{ steps.parse.outputs.dir }}
          PR: ${{ steps.pr.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n' "分析を開始した: \`companies/${DIR}\`（作業ブランチ \`${BRANCH}\`、ドラフト PR: ${PR}）。" "" \
            "- 情報収集は担当ごとに進め、終わるたびにブランチへコミットする（済んだ担当は飛ばす）" \
            "- 実行ログ: ${RUN_URL}" > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"

  analyze:
    needs: request
    if: ${{ needs.request.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    environment: reports
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      TICKER: ${{ needs.request.outputs.ticker }}
      URL: ${{ needs.request.outputs.url }}
      MARKET: ${{ needs.request.outputs.market }}
      DIR: ${{ needs.request.outputs.dir }}
      PR: ${{ needs.request.outputs.pr }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BRANCH }} # what earlier runs collected
          fetch-depth: 0
          persist-credentials: false

      # Scheduled runs keep updating main (market reports, other companies): take them in first so the branch
      # analyses the latest material and the final merge has nothing to resolve.
      - name: Take in main
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet "$remote" main
          if git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              merge --quiet --no-edit FETCH_HEAD; then
            git push --quiet "$remote" "HEAD:refs/heads/${BRANCH}"
          else
            git merge --abort || true
            echo "::warning::main を作業ブランチに取り込めなかった（競合）。ブランチのまま進める"
          fi

      - id: setup
        uses: ./.github/actions/setup-reports
        with:
          edinet-api-key: ${{ secrets.EDINET_API_KEY }}
          fred-api-key: ${{ secrets.FRED_API_KEY }}
          sec-user-agent: ${{ secrets.SEC_USER_AGENT }}
          claude-code-version: ${{ env.CLAUDE_CODE_VERSION }}

      # One Claude run per pending agent (then the aggregation), each committed and pushed to the branch.
      # The values were validated by issue_request.py (no spaces, quotes or $), so they are safe as arguments.
      - name: Collect (resumes where it stopped)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PUSH_TOKEN: ${{ github.token }}
          AUTOSAVE_BRANCH: ${{ env.BRANCH }}
        run: |
          name="${DIR#*_}"
          prev=""
          for round in 1 2 3 4 5 6; do
            next="$(python3 -I tools/collect/collect_progress.py --company "$DIR" \
              | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["next"])')"
            echo "collect_progress: next=$next"
            if [ "$next" = "done" ]; then
              echo "- 情報収集: 済み" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$next" = "$prev" ]; then
              echo "::error::${next} を実行したが、まだ未了（書く raw が揃っていない）"
              exit 1
            fi
            if [ "$next" = "aggregate" ]; then step="集約のみ"; else step="担当=${next}"; fi
            status=0
            bash .github/scripts/run-claude.sh "/collect-company-info $TICKER $name $URL $MARKET mode=full $step" \
              "情報収集 ${DIR}（${next}）" "$RUNNER_TEMP/collect-${next}.json" || status=$?
            BRANCH="$BRANCH" bash .github/scripts/commit-outputs.sh "chore: ${DIR} の情報収集（${next}・Issue #${ISSUE}）"
            [ "$status" -eq 0 ] || exit "$status"
            prev="$next"
          done
          echo "::error::情報収集が規定の回数で終わらなかった"
          exit 1

      - name: Run /company-report
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PUSH_TOKEN: ${{ github.token }}
          AUTOSAVE_BRANCH: ${{ env.BRANCH }}
        # Repeats /company-report until the report is built (a headless run tends to stop after one analysis),
        # committing to the branch after each run.
        run: |
          bash .github/scripts/run-company-report.sh "$DIR" "企業分析レポート $DIR" "$RUNNER_TEMP/report.json"

      - name: Check the report was built
        id: built
        run: |
          status="$(.venv/bin/python -I tools/report/company_report.py check --company "$DIR" || true)"
          next="$(printf '%s' "$status" | python3 -I -c 'import json,sys; print(json.load(sys.stdin).get("next", ""))')"
          echo "next: $next"
          if [ "$next" != "report_existing" ]; then
            echo "::error::$DIR の今日のレポートが build されていない（check の next: $next）"
            exit 1
          fi

      # Whatever was done is kept on the branch, also when a step above failed.
      - name: Commit
        id: commit
        if: ${{ !cancelled() }}
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="$BRANCH" bash .github/scripts/commit-outputs.sh "chore: ${DIR} の企業分析レポート（Issue #${ISSUE}・自動実行 $(date +%F)）"

      - name: Merge the PR
        id: merge
        if: ${{ steps.built.outcome == 'success' && steps.commit.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready "$PR" -R "$GITHUB_REPOSITORY"
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject "chore: ${DIR} の初期分析と企業分析レポート（Issue #${ISSUE}）"

      - name: Save originals
        if: ${{ always() && steps.setup.outputs.cache-key != '' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            companies/*/sources
            market/**/sources
            .cache
            !companies/*/sources/manifest.csv
            !market/**/sources/manifest.csv
          key: ${{ steps.setup.outputs.cache-key }}

      # Closes the Issue only when the report is built and merged into main; otherwise comments and leaves it open.
      - name: Report to the Issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.built.outcome == 'success' && steps.commit.outcome == 'success' && 'success' || 'failure' }}
          MERGED: ${{ steps.merge.outcome == 'success' && 'yes' || 'no' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status=0
          results=("$RUNNER_TEMP"/collect-*.json "$RUNNER_TEMP/report.json")
          python3 -I .github/scripts/issue_comment.py --outcome "$OUTCOME" --ticker "$TICKER" \
            --repo "$GH_REPO" --run-url "$RUN_URL" --pr-url "$PR" --merged "$MERGED" \
            --result "${results[@]}" > "$RUNNER_TEMP/comment.md" || status=$?
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          if [ "$status" -eq 0 ]; then
            gh issue close "$ISSUE" --reason completed || true # usually closed already by the merge (Closes #n)
          else
            echo "::warning::レポートが main にマージされていないため Issue #$ISSUE は開いたまま"
          fi
