# Unit tests of the collectors, analyses and reports on every push to main and every pull request.
# The tests work on fixtures under tmp_path: no network, no API keys, no Claude Code.
name: tests

on:
  push:
    branches: [main]
  # The report workflows push only companies/ and market/ (an Issue's draft PR gets one push per Claude run):
  # a PR that changes nothing else has no code to test.
  pull_request:
    paths-ignore:
      - "companies/**"
      - "market/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Tokyo # the same as the report workflows: the scripts date their files with the local date

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12" # the same as .github/actions/setup-reports
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install
        run: python -m pip install -r tools/requirements.txt

      - name: pytest
        run: python -m pytest -q tools/analysis/tests tools/report/tests tools/collect/tests
